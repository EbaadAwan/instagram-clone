<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <header>
            <img id="logo" src="images/logo.png">
            <img id="avatar" src="images/user-avatar.png">
        </header>
        
        <section>
            <div class="text-wrap">
                <div class="container">
                    <img id="vangogh-logo" src="/images/avatar-vangogh.jpg">
                    <div>
                        <p class="name">Vincent van Gogh</p>
                        <p class="location">Zundert, Netherlands</p>
                    </div>
                </div>
            </div>
            
            <img id="post" src="/images/post-vangogh.jpg">
            
            <div class="icon">
                <img id="like" src="/images/icon-heart.png">
                <img id="comment" src="/images/icon-comment.png">
                <img id="dm" src="/images/icon-dm.png">
                
                <p class="likes">21492 likes</p>
                <p class="user-comment"><span>vincey1853 </span> took a few mushrooms lol</p>
            </div>
            
        </section>
        
        <script src="index.js"></script>
    </body>
</html>
